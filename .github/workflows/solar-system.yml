name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
  MONGO_URI: mongodb+srv://supercluster.d83jj.mongodb.net/superData
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.Mongo_PASSWORD }}
    
jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Print Environment Variables
          run: |
            echo "MONGO_URI: $MONGO_URI"
            echo "MONGO_USERNAME: $MONGO_USERNAME"
            echo "MONGO_PASSWORD: $MONGO_PASSWORD"

        - name: Setup NodeJS Version
          uses: actions/setup-node@v4
          with:
            node-version: 18
        - name: Cache NPM Dependencies
          uses: actions/cache@v4
          with:
            path: ~/.npm
            key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
            restore-keys: |
              ${{ runner.os }}-node-

    
        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test
          
          
        - name: Archive Test Result
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result
            path: test-results.xml
    code-coverage:
      name: Code Coverage
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
    
        - name: Setup NodeJS Version
          uses: actions/setup-node@v4
          with:
            node-version: 18
    
        - name: Install Dependencies
          run: npm install
    
        - name: Run Code Coverage
          run: npm run coverage
          continue-on-error: true
    
        - name: Upload Code Coverage Report
          uses: actions/upload-artifact@v4
          with:
            name: Code-Coverage-Result
            path: coverage
            retention-days: 5

    docker:
      name: containerisation
      needs: [unit-testing, code-coverage]
      runs-on: ubuntu-latest
      steps:
        - name: checkout repository
          uses: actions/checkout@v4

        - name: Dockerhub login
          uses: docker/login-action@v2
          with:
            username: ${{ vars.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Build and push
          uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: ${{vars.DOCKER_USERNAME}}/solar-system:${{ github.sha }}

        - name: docker image test
          run: |
            docker images
            docker run --name solar-system-app  -d -p 3000:3000 -e MONGO_URI=${{ env.MONGO_URI }} -e MONGO_USERNAME=${{ env.MONGO_USERNAME }} -e MONGO_PASSWORD=${{ env.MONGO_PASSWORD }} ${{vars.DOCKER_USERNAME}}/solar-system:${{ github.sha }}
            sleep 10
            export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
            echo "Container IP: $IP"
            
            echo "Testing the application..."
            wget -q -O - --timeout=10 --tries=3 http://$IP:3000/live | grep live 

    deploy-dev:
      needs: [docker]
      uses: ./.github/workflows/reusable-workflow.yml
      with:
        environment: development
        image_tag: ${{ github.sha }}
        MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
      secrets:
        KUBECONFIG: ${{ secrets.KUBECONFIG }}
        MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

    deploy-prod:
      needs: [docker]
      if: github.ref == 'refs/heads/main'
      uses: ./.github/workflows/reusable-workflow.yml
      with:
        environment: production
        image_tag: ${{ github.sha }}
        MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
      secrets:
        KUBECONFIG: ${{ secrets.KUBECONFIG }}
        MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

