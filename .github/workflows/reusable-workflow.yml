name: Reusable Kubernetes Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      MONGO_USERNAME:
        required: true
        type: string
    secrets:
      KUBECONFIG:
        required: true
      MONGO_PASSWORD:
        required: true

jobs:
  deploy:
    runs-on: dev
    environment: ${{ inputs.environment }}
    outputs:
      endpoint: ${{ steps.set-output.outputs.endpoint }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      # - name: Set up kubeconfig
      #   run: |
      #     mkdir -p ~/.kube
      #     echo "secrets.KUBECONFIG" > ~/.kube/config

      - name: Template manifests
        env:
          NAMESPACE: ${{ vars.NAMESPACE }}
          REPLICAS: ${{ vars.REPLICAS }}
          IMAGE: ${{ vars.DOCKER_USERNAME }}/solar-system:${{ inputs.image_tag }}
        run: |
          for f in kubernetes/${{ inputs.environment }}/*.yaml; do
            envsubst < "$f" > "rendered-$(basename $f)"
          done

      - name: Create namespace if not exists
        env:
          NAMESPACE: ${{ vars.NAMESPACE }}
        run: |
          kubectl get namespace "$NAMESPACE" || kubectl create namespace "$NAMESPACE"

      - name: Deploy to Kubernetes
        env:
          NAMESPACE: ${{ vars.NAMESPACE }}
        run: |
          kubectl create secret generic mongo-db-creds \
          --from-literal=MONGO_USERNAME="$MONGO_USERNAME" \
          --from-literal=MONGO_PASSWORD="$MONGO_PASSWORD" \
          -n "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f rendered-deployment.yaml -n "$NAMESPACE"
          kubectl apply -f rendered-service.yaml -n "$NAMESPACE"
          kubectl apply -f rendered-ingress.yaml -n "$NAMESPACE"

      - name: Get Service Endpoint
        id: set-output
        env:
          NAMESPACE: ${{ vars.NAMESPACE }}
        run: |
          NODE_IP=$(kubectl get nodes -o jsonpath="{.items[0].status.addresses[?(@.type=='InternalIP')].address}")
          NODE_PORT=$(kubectl get svc solar-system -n "$NAMESPACE" -o jsonpath='{.spec.ports[0].nodePort}')
          FULL_URL="http://$NODE_IP:$NODE_PORT"
          echo "Application is accessible at: $FULL_URL"
          echo "endpoint=$FULL_URL" >> $GITHUB_OUTPUT


