name: Reusable Kubernetes Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string
    secrets:
      KUBECONFIG:
        required: true

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: dev
    environment: ${{ inputs.environment }}
    outputs:
      endpoint: ${{ steps.set-output.outputs.endpoint }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

      - name: Template deployment manifest
        run: |
          export NAMESPACE=${{ inputs.environment }}
          export REPLICAS=2
          export IMAGE=my-app:${{ inputs.image_tag }}
          envsubst < kubernetes/${{ inputs.environment }}/deployment.yaml > deployment-rendered.yaml

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f deployment-rendered.yaml

      - name: Get Service Endpoint
        id: set-output
        run: |
          ENDPOINT=$(kubectl get svc solar-system -n ${{ inputs.environment }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "endpoint=$ENDPOINT" >> $GITHUB_OUTPUT

